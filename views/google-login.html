<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 海外社区运营后台</title>
  <link rel="stylesheet" href="/static/css/m2g-theme.css">
  <style>
    .screen-login{padding:90px 0 110px;position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center}
    .loading{display:none;margin-top:20px;text-align:center}
    .spinner{border:3px solid var(--hair);border-top:3px solid var(--ink);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .error-message{color:var(--err);margin-top:15px;padding:10px;background:rgba(192,82,72,.1);border:1px solid rgba(192,82,72,.3);border-radius:6px;display:none;font-size:13px}
  </style>
</head>
<body>

<section class="screen-login grid-bg">
  <div class="wrap login-flex">
    <div class="login-left">
      <div class="micro">Overseas Community Console</div>
      <div class="huge">Publish<br>Monitor<br>Report</div>
      <p>发布、舆情、周报、术语——把海外多区社区运营的日常工作，收进一套控制台。</p>
    </div>
    <div class="login-card">
      <div class="micro">Sign In</div>
      <h3>登录控制台</h3>
      
      <button class="g-btn" id="googleLoginBtn" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1H12v2.9h5.35c-.5 2.4-2.55 4.1-5.35 4.1a5.9 5.9 0 0 1 0-11.8c1.5 0 2.85.55 3.9 1.45l2.15-2.15A8.9 8.9 0 0 0 12 3a9 9 0 1 0 0 18c5.2 0 8.65-3.65 8.65-8.8 0-.4-.1-.75-.3-1.1z"/></svg>
        使用 Google 账号登录
      </button>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top:10px;color:var(--mut);font-size:13px">正在跳转...</p>
      </div>
      
      <div class="error-message" id="errorMessage"></div>
      <div class="hint">仅限授权运营人员访问</div>
    </div>
  </div>
</section>
  
  <script>
    // 页面加载时检查是否已登录（Cookie 有效则直接跳转首页）
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const resp = await fetch('/api/auth/verify', { credentials: 'same-origin' });
        if (resp.ok) {
          const data = await resp.json();
          if (data.valid) {
            window.location.href = '/';
          }
        }
      } catch (e) {
        // 未登录，继续显示登录页
      }

      // 显示 URL 中的错误信息（如 OAuth 回调失败）
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      if (error) {
        showError(error);
      }
    });
    
    async function handleGoogleLogin() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('googleLoginBtn').style.display = 'none';
      hideError();
      
      try {
        const response = await fetch('/api/auth/google/login');
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || '获取授权链接失败');
        }
        
        window.location.href = data.authUrl;
      } catch (error) {
        showError(error.message);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('googleLoginBtn').style.display = 'inline-flex';
      }
    }
    
    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }
    
    function hideError() {
      document.getElementById('errorMessage').style.display = 'none';
    }
  </script>
</body>
</html>
