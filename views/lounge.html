<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🇰🇷 韩国社区监控 - M2G 用户运营后台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇰🇷</text></svg>">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/pages/lounge.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 登录检测 -->
<div id="loginScreen">
  <div class="login-card" style="text-align:center;">
    <h1>M2G 用户运营后台</h1>
    <p style="margin:20px 0;color:#666;">正在检测登录状态...</p>
    <div class="spinner" style="border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto;"></div>
    <p style="margin-top:15px;"><a href="/login">点击这里登录</a></p>
  </div>
</div>
<style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>

<!-- 主界面 -->
<div id="mainApp" style="display:none;">
  <header class="app-header">
    <div class="app-header-inner">
      <div class="header-left">
        <h1>🇰🇷 韩国社区监控</h1>
        <p>Naver Game Lounge · Tree of Savior: Neverland</p>
      </div>
      <nav class="header-nav" id="mainNav"></nav>
    </div>
  </header>

  <div class="container">
    <!-- 页面标题 + 操作栏 -->
    <div class="lounge-header">
      <div class="lounge-title">
        <h2>🇰🇷 韩国社区监控</h2>
        <p class="lounge-subtitle">Naver Game Lounge · Tree of Savior: Neverland</p>
      </div>
      <div class="lounge-actions">
        <span class="crawl-status" id="crawlStatus">--</span>
        <button class="btn btn-primary" id="btnCrawl" onclick="triggerCrawl()">🔄 立即抓取</button>
        <button class="btn btn-secondary" onclick="loadPosts()">🔃 刷新</button>
      </div>
    </div>

    <!-- 今日概览卡片 -->
    <div class="lounge-stats" id="statsCards">
      <div class="lounge-stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-body">
          <div class="stat-value" id="statPosts">0</div>
          <div class="stat-label">今日帖子</div>
        </div>
      </div>
      <div class="lounge-stat-card">
        <div class="stat-icon">💬</div>
        <div class="stat-body">
          <div class="stat-value" id="statComments">0</div>
          <div class="stat-label">今日评论</div>
        </div>
      </div>
      <div class="lounge-stat-card stat-positive">
        <div class="stat-icon">😊</div>
        <div class="stat-body">
          <div class="stat-value" id="statPositive">0</div>
          <div class="stat-label">正面</div>
        </div>
      </div>
      <div class="lounge-stat-card stat-neutral">
        <div class="stat-icon">😐</div>
        <div class="stat-body">
          <div class="stat-value" id="statNeutral">0</div>
          <div class="stat-label">中性</div>
        </div>
      </div>
      <div class="lounge-stat-card stat-negative">
        <div class="stat-icon">😠</div>
        <div class="stat-body">
          <div class="stat-value" id="statNegative">0</div>
          <div class="stat-label">负面</div>
        </div>
      </div>
    </div>

    <!-- 预警区域 -->
    <div class="lounge-alerts" id="alertSection" style="display:none;">
      <h3>⚠️ 舆情预警</h3>
      <div id="alertList"></div>
    </div>

    <!-- AI 日报 -->
    <div class="lounge-report" id="reportSection" style="display:none;">
      <h3>📊 AI 舆情日报</h3>
      <div class="report-content" id="reportContent"></div>
      <div class="report-topics" id="reportTopics"></div>
    </div>

    <!-- 筛选栏 -->
    <div class="lounge-filters">
      <select id="filterSentiment" onchange="loadPosts()">
        <option value="">全部情感</option>
        <option value="positive">😊 正面</option>
        <option value="neutral">😐 中性</option>
        <option value="negative">😠 负面</option>
      </select>
      <input type="text" id="filterKeyword" placeholder="搜索关键词..." onkeyup="if(event.key==='Enter')loadPosts()">
      <button class="btn btn-small" onclick="loadPosts()">搜索</button>
    </div>

    <!-- 帖子列表 -->
    <div class="lounge-posts" id="postList">
      <div class="loading-placeholder">加载中...</div>
    </div>

    <!-- 分页 -->
    <div class="lounge-pagination" id="pagination"></div>
  </div>
</div>

<!-- 帖子详情弹窗 -->
<div class="modal-overlay" id="postModal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal-content lounge-modal">
    <div class="modal-header">
      <h3 id="modalTitle">帖子详情</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="loading-placeholder">加载中...</div>
    </div>
  </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/lounge.js"></script>
</body>
</html>
