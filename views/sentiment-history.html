<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>📚 舆情历史数据 - M2G 用户运营后台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages/history.css">
  <script src="/static/js/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jschardet@3.1.4/dist/jschardet.min.js"></script>
</head>
<body>
  <header class="app-header">
  <div class="app-header-inner">
    <div class="header-left">
      <h1>📚 舆情历史数据</h1>
      <p>所有采集到的玩家发言记录，用于周报分析</p>
    </div>
    <nav class="header-nav" id="mainNav"></nav>
  </div>
  </header>

  <div class="container">
    <!-- 数据管理（采集 + 上传 + 筛选 整合为一个卡片） -->
    <div class="data-management super-admin-only">
      <!-- 顶部操作行：启动抓取 + 手动上传 -->
      <div class="mgmt-toolbar">
        <div class="mgmt-collect">
          <span class="mgmt-label">📡 数据采集</span>
          <button class="btn btn-primary btn-sm" id="btnCollect" onclick="startCollecting()">▶ 启动抓取</button>
        </div>
        <div class="mgmt-upload">
          <span class="mgmt-label">📤 手动上传</span>
          <button class="btn btn-secondary btn-sm" onclick="toggleUploadPanel()">展开 / 收起</button>
        </div>
      </div>
      <!-- 抓取进度条 -->
      <div id="collectProgressBar" class="collect-progress-bar" style="display:none;">
        <div class="collect-progress-header">
          <span class="collect-progress-icon" id="collectProgressIcon">⏳</span>
          <span class="collect-progress-text" id="collectProgressText">准备中...</span>
          <span class="collect-progress-elapsed" id="collectProgressElapsed"></span>
        </div>
        <div class="collect-progress-track">
          <div class="collect-progress-fill" id="collectProgressFill" style="width:0%"></div>
        </div>
        <div class="collect-progress-detail" id="collectProgressDetail"></div>
      </div>
      <!-- 抓取结果摘要 -->
      <div id="collectResult" class="collect-result" style="display:none;"></div>
      <!-- 手动上传面板（收起状态） -->
      <div id="uploadPanel" class="upload-panel" style="display:none;">
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <button id="uploadTabTwitter" class="btn btn-primary btn-sm" onclick="switchUploadTab('twitter')">🐦 Twitter CSV</button>
          <button id="uploadTabDiscord" class="btn btn-secondary btn-sm" onclick="switchUploadTab('discord')">💬 Discord 文本</button>
        </div>
        <div id="uploadTwitter">
          <p style="font-size:12px; color:var(--color-text-secondary,#666); margin-bottom:8px;">选择 Twitter 搜索导出的 CSV 文件（需包含 created_at, full_text, url 等字段）</p>
          <input type="file" id="twitterCsvFile" accept=".csv" style="margin-bottom:8px;">
          <button class="btn btn-primary btn-sm" onclick="uploadTwitterCSV()">上传并处理</button>
        </div>
        <div id="uploadDiscord" style="display:none;">
          <p style="font-size:12px; color:var(--color-text-secondary,#666); margin-bottom:8px;">粘贴 Discord 聊天记录（格式：用户名 — 日期 时间，下一行是消息内容）</p>
          <textarea id="discordTextInput" rows="6" placeholder="Seraphm — 2026/7/23 22:06&#10;無盡大約有50人吧&#10;&#10;luguo1354 — 2026/7/24 16:07&#10;我們從1300升到1700多" style="width:100%; font-size:13px; padding:10px; border:1px solid #d1d5db; border-radius:6px; margin-bottom:8px; font-family:monospace;"></textarea>
          <button class="btn btn-primary btn-sm" onclick="uploadDiscordText()">上传并处理</button>
        </div>
        <div id="uploadResult" style="margin-top:10px; font-size:13px;"></div>
      </div>
      <!-- 筛选行：一行展示 -->
      <div class="mgmt-filters">
        <select id="platformFilter">
          <option value="">全部平台</option>
          <option value="twitter">Twitter</option>
          <option value="discord">Discord</option>
        </select>
        <input type="date" id="startDate">
        <span class="filter-sep">~</span>
        <input type="date" id="endDate">
        <button class="btn btn-sm btn-query" onclick="loadData()">🔍 查询</button>
      </div>
    </div>

    <!-- 数据表格 -->
    <div class="data-table-container">
      <div id="loadingState" class="loading">加载中...</div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
        <p>暂无数据</p>
      </div>
      <table class="data-table" id="dataTable" style="display: none;">
        <thead>
          <tr>
            <th style="width: 100px;">平台</th>
            <th style="width: 150px;">作者</th>
            <th style="width: 180px;">发布时间</th>
            <th>内容</th>
            <th style="width: 100px;">链接</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <!-- 分页 -->
      <div class="pagination" id="pagination" style="display: none;">
        <button onclick="changePage(-1)" id="prevBtn">上一页</button>
        <span class="pagination-info" id="pageInfo">第 1 页 / 共 1 页</span>
        <button onclick="changePage(1)" id="nextBtn">下一页</button>
      </div>
    </div>

    <!-- 韩国社区板块 -->
    <div class="lounge-section">
      <div class="lounge-header">
        <h2>🇰🇷 韩国社区帖子</h2>
        <span class="lounge-subtitle">Naver Game Lounge · Tree of Savior</span>
        <span class="lounge-count" id="loungeTotal">-</span>
      </div>
      <div id="loungeLoading" class="loading">加载中...</div>
      <div id="loungeEmpty" class="empty-state" style="display:none;">
        <p>暂无韩国社区数据</p>
      </div>
      <div id="loungeList" class="lounge-list"></div>
      <!-- 韩国帖子分页 -->
      <div class="pagination" id="loungePagination" style="display:none;">
        <button onclick="changeLoungePage(-1)" id="loungePrevBtn">上一页</button>
        <span class="pagination-info" id="loungePageInfo">第 1 页 / 共 1 页</span>
        <button onclick="changeLoungePage(1)" id="loungeNextBtn">下一页</button>
      </div>
    </div>

    <!-- 韩国评论弹窗 -->
    <div id="loungeModal" class="lounge-modal" style="display:none;" onclick="if(event.target===this)closeLoungeModal()">
      <div class="lounge-modal-content">
        <div class="lounge-modal-header">
          <h3 id="loungeModalTitle">帖子详情</h3>
          <button onclick="closeLoungeModal()" class="lounge-modal-close">&times;</button>
        </div>
        <div id="loungeModalBody" class="lounge-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="/static/js/history.js"></script>
</body>
</html>
