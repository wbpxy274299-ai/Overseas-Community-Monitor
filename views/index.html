<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🚀 DC 发布管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/pages/home.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ===== 登录检测中 ===== -->
<div id="loginScreen">
  <div class="login-card" style="text-align:center;">
    <h1>DC 发布管理系统</h1>
    <p style="margin: 20px 0; color: #666;">正在检测登录状态...</p>
    <div class="spinner" style="border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto;"></div>
    <p style="margin-top: 15px;"><a href="/login">点击这里登录</a></p>
  </div>
</div>
<style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>

<!-- ===== 主界面 ===== -->
<div id="mainApp" style="display:none;">
  <header class="app-header">
  <div class="app-header-inner">
    <div class="header-left">
      <h1>🚀 DC 发布管理系统</h1>
      <p>Discord 多服务器消息发布与任务管理</p>
    </div>
    <nav class="header-nav" id="mainNav"></nav>
  </div>
  </header>

  <div class="container">
  <div class="identity-bar">
    <div class="identity-info">
      <span class="identity-label">操作人:</span>
      <span class="identity-name" id="currentOperator">—</span>
      <button class="btn btn-small btn-logout" id="logoutBtn">退出登录</button>
    </div>
  </div>

  <!-- 统计概览 -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-mini stat-today">
      <div class="stat-mini-icon">📤</div>
      <div class="stat-mini-body">
        <div class="stat-mini-value" id="statTodaySent">0</div>
        <div class="stat-mini-label">今日已发</div>
      </div>
    </div>
    <div class="stat-mini stat-pending">
      <div class="stat-mini-icon">⏳</div>
      <div class="stat-mini-body">
        <div class="stat-mini-value" id="statTodayPending">0</div>
        <div class="stat-mini-label">待发送</div>
      </div>
    </div>
    <div class="stat-mini stat-failed">
      <div class="stat-mini-icon">❌</div>
      <div class="stat-mini-body">
        <div class="stat-mini-value" id="statTodayFailed">0</div>
        <div class="stat-mini-label">失败</div>
      </div>
    </div>
    <div class="stat-mini stat-total">
      <div class="stat-mini-icon">📊</div>
      <div class="stat-mini-body">
        <div class="stat-mini-value" id="statTotal">0</div>
        <div class="stat-mini-label">总任务数</div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="submit">📝 提交发送</button>
    <button class="tab-btn" data-tab="list">📋 任务列表</button>
  </div>

  <!-- Tab1: 提交发送 -->
  <div id="tab-submit" class="tab-panel active">
    <form id="sendForm">
      <div class="form-section">
        <div class="form-section-title">📍 发送设置</div>
        <div class="form-row-2col">
          <div class="form-group">
            <label>发送模式</label>
            <div class="mode-switch">
              <label class="mode-option selected" data-mode="now">
                <input type="radio" name="sendMode" value="now" checked>
                <span class="mode-icon">⚡</span>
                <span class="mode-text">立即发送</span>
              </label>
              <label class="mode-option" data-mode="schedule">
                <input type="radio" name="sendMode" value="schedule">
                <span class="mode-icon">📅</span>
                <span class="mode-text">定时发送</span>
              </label>
            </div>
          </div>
          <div class="form-group" id="sendTimeGroup" style="display:none;">
            <label>定时时间</label>
            <input type="datetime-local" id="sendTime">
          </div>
          <div class="form-group">
            <label>发送地区 *</label>
            <select id="serverRegion" required>
              <option value="">-- 请选择地区 --</option>
              <option value="JP">🇯🇵 日服</option>
              <option value="TC">🇹🇼 繁中服</option>
              <option value="SEA">🌏 东南亚服</option>
              <option value="KR">🇰🇷 韩服</option>
            </select>
          </div>
          <div class="form-group">
            <label>频道 *</label>
            <select id="channel" required disabled>
              <option value="">-- 请先选择地区 --</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>发送人（根据频道自动填充）</label>
          <input type="text" id="sender" readonly placeholder="选择频道后自动填充" class="readonly-field">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">✍️ 消息内容</div>
        <div class="form-group">
          <textarea id="content" placeholder="输入要发送的文字内容... 支持 Discord Markdown 格式（**粗体** *斜体* > 引用）"></textarea>
          <div class="textarea-footer">
            <span class="char-count" id="charCount">0 字</span>
            <span class="format-hint">支持 **粗体** *斜体* ~~删除线~~ `代码`</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">🖼️ 附件图片</div>
        <div class="form-group">
          <div class="upload-dropzone" id="uploadDropzone">
            <div class="upload-dropzone-inner">
              <div class="upload-icon">📁</div>
              <div class="upload-text">拖拽图片到这里，或 <span class="upload-link">点击选择文件</span></div>
              <div class="upload-hint">支持 JPG / PNG / GIF，可多选</div>
            </div>
            <input type="file" id="imageFiles" multiple accept="image/*" class="upload-input">
          </div>
          <div id="imagePreview" class="image-preview"></div>
        </div>
      </div>

      <div class="form-submit-row">
        <button type="submit" class="btn btn-primary btn-submit" id="submitBtn">
          <span class="btn-icon">⚡</span>
          <span id="submitBtnText">立即发送</span>
        </button>
      </div>
    </form>
    <div id="sendMsg"></div>
  </div>

  <!-- Tab2: 任务列表 -->
  <div id="tab-list" class="tab-panel">
    <div class="filter-bar">
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="received">📝已接收</option>
        <option value="scheduled">📅已定时</option>
        <option value="sent">✅已发送</option>
        <option value="failed">❌失败</option>
        <option value="cancelled">🚫已取消</option>
        <option value="recalled">🗑️已撤回</option>
      </select>
      <select id="filterChannel">
        <option value="">全部频道</option>
      </select>
      <input type="text" id="searchInput" placeholder="🔍 搜索内容/频道/操作人..." style="min-width:180px;">
      <button class="btn btn-small btn-primary" id="refreshBtn">刷新</button>
      <button class="btn btn-small btn-success" id="exportBtn">导出报告</button>
      <span id="taskCount" class="task-count"></span>
      <span id="batchActions" style="display:none;margin-left:auto;">
        <button class="btn btn-small btn-danger" id="batchCancelBtn">批量取消</button>
        <button class="btn btn-small btn-warning" id="batchRecallBtn">批量撤回</button>
        <button class="btn btn-small btn-success" id="batchRetryBtn">批量重试</button>
      </span>
    </div>
    <table class="task-table">
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll" title="全选"></th>
          <th>ID</th><th>频道</th><th>内容</th><th>类型</th><th>状态</th>
          <th>定时时间</th><th>实际发送时间</th><th>发送人</th><th>操作人</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="taskListBody"></tbody>
    </table>
  </div>
  </div><!-- /.container -->
</div>

<!-- 任务详情弹窗 -->
<div id="taskDetailModal" class="modal-overlay modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="detailTitle">任务详情</h3>
      <button class="modal-close" id="closeDetailBtn">&times;</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<!-- Discord 真实效果弹窗 -->
<div id="dcPreviewModal" class="modal-overlay modal-backdrop-dark">
  <div class="dc-preview-container">
    <button class="modal-close-light" id="closePreviewBtn" style="position:absolute;top:-40px;right:0;">&times;</button>
    <div class="dc-preview-header">
      <span class="dc-preview-hash">#</span>
      <span id="dcPreviewChannel">频道名称</span>
      <span class="dc-preview-badge">实时拉取</span>
    </div>
    <div id="dcPreviewBody" class="dc-preview-body">
      <div class="dc-loading">加载中...</div>
    </div>
  </div>
</div>

<!-- 二次确认弹窗 -->
<div id="confirmModal" class="modal-overlay modal-backdrop">
  <div class="modal-content" style="max-width: 400px;">
    <div class="modal-header">
      <h3 id="confirmTitle">确认操作</h3>
      <button class="modal-close" id="closeConfirmBtn">&times;</button>
    </div>
    <div id="confirmBody" style="padding: 20px; text-align: center;">
      <p id="confirmMessage"></p>
      <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
        <button class="btn btn-danger" id="confirmYesBtn">确认</button>
        <button class="btn" id="confirmNoBtn">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- 图片查看弹窗 -->
<div id="imageViewerModal" class="modal-overlay modal-backdrop-dark">
  <div class="image-viewer">
    <button class="modal-close-light" id="closeViewerBtn">&times;</button>
    <img id="imageViewerImg" src="">
  </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/home.js"></script>
</body>
</html>
