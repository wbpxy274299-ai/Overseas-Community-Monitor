<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>📋 M2G 舆情周报管理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <script src="/static/js/common.js"></script>
  <link rel="stylesheet" href="/static/css/m2g-theme.css">
  <style>
    .rep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .rep-grid { grid-template-columns: 1fr; } }
    /* 黑面板内 markdown 内容样式 */
    #currentReportContent h1,#currentReportContent h2,#currentReportContent h3{color:var(--cut-ink);margin:18px 0 10px;font-weight:700}
    #currentReportContent h1{font-size:18px}#currentReportContent h2{font-size:16px}#currentReportContent h3{font-size:14px}
    #currentReportContent p{color:var(--cut-mut);font-size:13px;line-height:1.7;margin:8px 0}
    #currentReportContent table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
    #currentReportContent th{color:var(--cut-mut);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
    #currentReportContent td{color:var(--cut-mut);padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
    #currentReportContent blockquote{border-left:3px solid rgba(255,255,255,.2);padding:8px 14px;margin:10px 0;background:rgba(255,255,255,.04);border-radius:0 8px 8px 0;color:var(--cut-mut);font-size:13px}
    #currentReportContent ul{color:var(--cut-mut);font-size:13px;padding-left:20px;margin:8px 0}
    #currentReportContent li{margin:4px 0}
    #currentReportContent hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:16px 0}
    #currentReportContent strong{color:var(--cut-ink)}
  </style>
</head>
<body>
  <div class="wrap page-head" style="padding:36px 0 20px">
    <div class="micro">Weekly Reports · 周报管理 — 查看和管理舆情周报，支持手动生成新报告</div>
    <div class="huge" style="font-size:clamp(26px,3.2vw,40px);line-height:1.15;margin:8px 0 16px">Report Archive</div>
    <div class="chips">
      <span class="chip">共 <span id="reportCount">0</span> 份报告</span>
      <button class="btn btn-ghost btn-sm" onclick="checkData()">检查数据状态</button>
      <button class="btn btn-ghost btn-sm" onclick="loadReports()">刷新列表</button>
      <button class="btn btn-solid btn-sm" id="generateReportBtn" onclick="generateReport()" style="margin-left:auto">生成新周报 <span class="ar">→</span></button>
    </div>
  </div>

  <div class="wrap">
    <!-- 当前周报（黑切角大面板） -->
    <div class="panel-cut mb32" id="currentReportPanel" style="padding:34px 34px 30px;display:none">
      <div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px">
        <h2 style="font-size:20px" id="currentReportTitle">Current Report<br>当前周报</h2>
        <p class="desc" id="currentReportMeta"></p>
      </div>
      <div id="currentReportStats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px"></div>
      <div id="currentReportContent"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px">
        <button class="btn btn-light" onclick="viewCurrentReport()">查看完整报告 <span class="ar">→</span></button>
        <button class="btn btn-ghost-panel" onclick="downloadCurrentReport()">下载报告</button>
      </div>
    </div>

    <!-- 历史报告（白卡） -->
    <div class="card card-pad mb32">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <div><div class="micro" style="margin-bottom:6px">History</div><div class="card-title" style="font-size:17px">历史报告</div></div>
        <span class="micro" style="letter-spacing:.15em">按时间倒序</span>
      </div>
      <div id="reportList" class="rep-grid">
        <div class="loading" style="grid-column:1/-1">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 报告阅读器弹窗（结构化版） -->
  <style>
  .rpt-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
  .rpt-mask.open{display:flex}
  .rpt-shell{width:min(920px,100%);height:min(860px,92vh);background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.4)}
  .rpt-head{display:flex;gap:14px;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--hair);background:var(--panel-2)}
  .rpt-head .t{font-size:18px;font-weight:700;color:var(--ink)}
  .rpt-head .meta{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6}
  .rpt-head .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:22px;line-height:1;border:none;background:none;font-family:inherit}
  .rpt-head .x:hover{color:var(--ink)}
  .rpt-nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--hair)}
  .rpt-nav a{font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
  .rpt-nav a:hover,.rpt-nav a.on{color:var(--ink);border-color:var(--ink);background:var(--panel-2)}
  .rpt-body{flex:1;overflow-y:auto;padding:24px}
  .rpt-sec{font-size:15px;font-weight:700;color:var(--ink);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .rpt-sec:first-child{margin-top:0}
  .rpt-sec::before{content:'';width:3px;height:14px;background:var(--ink);border-radius:2px}
  .rpt-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--hair);background:var(--panel-2);flex-wrap:wrap}
  .rpt-stat{display:grid;gap:10px;margin-bottom:14px}
  .rpt-stat .c{border:1px solid var(--hair);border-radius:12px;padding:12px;text-align:center;background:var(--panel-2)}
  .rpt-stat .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .rpt-stat .t{font-size:10px;color:var(--mut);margin-top:2px}
  .rpt-subtitle{font-size:12px;color:var(--mut);margin-bottom:12px}
  .rpt-sumbox{background:var(--panel-2);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.7;margin-bottom:12px}
  .rpt-quote{border:1px solid var(--hair);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel)}
  .rpt-quote .q{font-size:13px;color:var(--ink);line-height:1.65}
  .rpt-quote .q .translation{color:var(--mut);font-size:12px;margin-top:6px;display:block}
  .rpt-quote .a{font-size:11px;color:var(--mut);margin-top:8px}
  @media(max-width:700px){.rpt-stat{grid-template-columns:repeat(2,1fr)}}
  </style>
  <div class="rpt-mask" id="rptReport" onclick="if(event.target===this)closeRpt('rptReport')">
    <div class="rpt-shell">
      <div class="rpt-head">
        <div><div class="t">📋 M2G 舆情监测周报</div><div class="meta" id="rptReportMeta">AI 驱动的舆情分析</div></div>
        <button class="x" onclick="closeRpt('rptReport')">×</button>
      </div>
      <div class="rpt-nav" id="rptReportNav"></div>
      <div class="rpt-body" id="rptReportBody"></div>
      <div class="rpt-foot">
        <span style="font-size:10px;letter-spacing:.15em;color:var(--mut)">本报告由 M2G 舆情监控系统自动生成</span>
        <div style="display:flex;gap:10px">
          <button class="btn btn-ghost btn-sm" onclick="copyReportSummary()">📋 复制总结</button>
          <button class="btn btn-solid btn-sm" onclick="downloadCurrentReport()">下载报告</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/reports.js"></script>
</body>
</html>
