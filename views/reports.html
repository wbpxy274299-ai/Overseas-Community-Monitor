<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>📋 M2G 舆情周报管理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <script src="/static/js/common.js"></script>
  <link rel="stylesheet" href="/static/css/m2g-theme.css">
</head>
<body>
  <div class="wrap page-head" style="padding:36px 0 20px">
    <div class="micro">舆情周报管理</div>
    <div class="huge" style="font-size:clamp(26px,3.2vw,40px);line-height:1.15;margin:8px 0 16px">舆情周报管理</div>
  </div>

  <div class="wrap">
    <!-- 操作栏 -->
    <div class="action-bar">
      <div>
        <button class="btn btn-primary admin-write-only" id="generateReportBtn" onclick="generateReport()">🔄 生成新周报</button>
        <button class="btn btn-secondary" onclick="checkData()">🔍 检查数据状态</button>
        <button class="btn btn-secondary" onclick="loadReports()">🔃 刷新列表</button>
      </div>
      <div style="font-size: 14px; color: var(--mut);">
        共 <span id="reportCount">0</span> 份报告
      </div>
    </div>

    <!-- 报告列表 -->
    <div class="report-list" id="reportList">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <!-- 报告详情弹窗 -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal-content report-detail-modal">
      <div class="modal-header">
        <h2 id="modalTitle">报告详情</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="markdown-content" id="modalContent"></div>
      </div>
    </div>
  </div>

  <script src="/static/js/reports.js"></script>
</body>
</html>
