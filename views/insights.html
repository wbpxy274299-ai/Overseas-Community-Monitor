
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>M2G 玩家洞察</title>
  <link rel="icon" href="/static/favicon-fire-spirit.png">
  <script src="/static/js/common.js"></script>
  <link rel="stylesheet" href="/static/css/m2g-theme.css">
  <style>
    .insight-empty-icon { width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 18px; }
    .rep-card .rh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .rep-card .rt { font-size: 15px; font-weight: 700; color: var(--ink); }
    .rep-card .rm { font-size: 13px; color: var(--mut); margin-top: 4px; }
    .stats-bar { display: flex; gap: 20px; flex-wrap: wrap; }
    .stats-bar .stat-item { text-align: center; }
    .stats-bar .stat-number { font-size: 24px; font-weight: 700; color: var(--ink); display: block; }
    .stats-bar .stat-label { font-size: 12px; color: var(--mut); }
  </style>
</head>
<body>
  <div class="wrap page-head" style="padding:36px 0 20px">
    <div class="micro">Player Insights · 玩家洞察 — AI 驱动的玩家需求分析报告</div>
    <div class="huge" style="font-size:clamp(26px,3.2vw,40px);line-height:1.15;margin:8px 0 16px">Player Insights</div>
    <div class="chips">
      <span class="chip" id="periodLabel">分析周期 · 加载中...</span>
      <span class="chip" id="historyCount">历史报告 · 0 份</span>
      <button class="btn btn-ghost btn-sm" id="btnGenerate" onclick="generateInsights()" style="margin-left:auto">生成洞察报告 <span class="ar">→</span></button>
    </div>
  </div>

  <div class="wrap">
    <!-- 统计概览（有报告时显示） -->
    <div class="stats-bar card card-pad mb32" id="statsBar" style="display:none;">
      <div class="stat-item"><span class="stat-number" id="statTotal">0</span><span class="stat-label">总发言数</span></div>
      <div class="stat-item"><span class="stat-number" id="statTwitter">0</span><span class="stat-label">🇯🇵 Twitter</span></div>
      <div class="stat-item"><span class="stat-number" id="statDiscord">0</span><span class="stat-label">🇹🇼 Discord</span></div>
      <div class="stat-item"><span class="stat-number" id="statLounge">0</span><span class="stat-label">🇰🇷 Naver</span></div>
      <div class="stat-item"><span class="stat-number" id="statPeriod">-</span><span class="stat-label">分析周期</span></div>
    </div>

    <!-- 报告区域 -->
    <div id="reportArea" class="mb32">
      <!-- 空状态（黑切角面板） -->
      <div class="panel-cut mb32" style="padding:48px 44px 44px;text-align:center">
        <div class="micro" style="color:var(--cut-mut);margin-bottom:20px" id="emptyPeriodLabel">Current Insight · 分析周期 加载中...</div>
        <div class="insight-empty-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--cut-ink)" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <div style="font-size:20px;font-weight:700;color:var(--cut-ink);margin-bottom:10px">还没有洞察报告</div>
        <p style="color:var(--cut-mut);font-size:13px;max-width:440px;margin:0 auto 24px;line-height:1.7">点击「生成洞察报告」，AI 将分析上周五到本周四的玩家发言，<br>为你输出专业的分析报告</p>
        <button class="btn btn-light" onclick="generateInsights()">生成洞察报告 <span class="ar">→</span></button>
      </div>
    </div>

    <!-- 历史报告存档 -->
    <div class="card card-pad mb32">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <div><div class="micro" style="margin-bottom:6px">History</div><div class="card-title" style="font-size:17px" id="historyTitle">历史报告存档</div></div>
      </div>
      <div id="historyList">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>


<!-- 报告阅读器弹窗（V45 结构化版） -->
<style>
.rpt-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.rpt-mask.open{display:flex}
.rpt-shell{width:min(920px,100%);height:min(860px,92vh);background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.4)}
.rpt-head{display:flex;gap:14px;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--hair);background:var(--panel-2)}
.rpt-head .t{font-size:18px;font-weight:700;color:var(--ink)}
.rpt-head .meta{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6}
.rpt-head .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:22px;line-height:1;border:none;background:none;font-family:inherit}
.rpt-head .x:hover{color:var(--ink)}
.rpt-nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--hair)}
.rpt-nav a{font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.rpt-nav a:hover,.rpt-nav a.on{color:var(--ink);border-color:var(--ink);background:var(--panel-2)}
.rpt-body{flex:1;overflow-y:auto;padding:24px}
.rpt-sec{font-size:15px;font-weight:700;color:var(--ink);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.rpt-sec:first-child{margin-top:0}
.rpt-sec::before{content:'';width:3px;height:14px;background:var(--ink);border-radius:2px}
.rpt-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--hair);background:var(--panel-2);flex-wrap:wrap}
.rpt-stat{display:grid;gap:10px;margin-bottom:14px}
.rpt-stat .c{border:1px solid var(--hair);border-radius:12px;padding:12px;text-align:center;background:var(--panel-2)}
.rpt-stat .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.rpt-stat .t{font-size:10px;color:var(--mut);margin-top:2px}
.rpt-subtitle{font-size:12px;color:var(--mut);margin-bottom:12px}
.rpt-sumbox{background:var(--panel-2);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.7;margin-bottom:12px}
.rpt-quote{border:1px solid var(--hair);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel)}
.rpt-quote .q{font-size:13px;color:var(--ink);line-height:1.65}
.rpt-quote .q .translation{color:var(--mut);font-size:12px;margin-top:6px;display:block}
.rpt-quote .a{font-size:11px;color:var(--mut);margin-top:8px}
@media(max-width:700px){.rpt-stat{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="rpt-mask" id="rptInsight" onclick="if(event.target===this)closeRpt('rptInsight')">
  <div class="rpt-shell">
    <div class="rpt-head">
      <div><div class="t">🤖 M2G 玩家洞察报告</div><div class="meta" id="rptMeta">AI 驱动的玩家需求分析</div></div>
      <button class="x" onclick="closeRpt('rptInsight')">×</button>
    </div>
    <div class="rpt-nav" id="rptNav"></div>
    <div class="rpt-body" id="rptBody"></div>
    <div class="rpt-foot">
      <span style="font-size:10px;letter-spacing:.15em;color:var(--mut)">本报告由 M2G 洞察系统自动生成</span>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost btn-sm" onclick="copyReportSummary()">📋 复制总结</button>
        <button class="btn btn-solid btn-sm" onclick="downloadReport()">下载报告</button>
      </div>
    </div>
  </div>
</div>

  <script src="/static/js/insights.js"></script>
</body>
</html>
