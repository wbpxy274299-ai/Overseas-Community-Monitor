<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>📖 术语校对 - M2G 用户运营后台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages/terminology.css">
  <script src="/static/js/common.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>📖 游戏术语校对</h1>
      <p>10万+游戏术语对照表，支持7种语言搜索与校对</p>
    </div>
    <nav class="header-nav" id="mainNav"></nav>
  </header>

  <div class="container">
    <div class="term-stats-bar" id="statsBar">加载中...</div>

    <div class="term-tabs">
      <button class="term-tab active" onclick="switchTermTab('search')">🔍 搜索术语</button>
      <button class="term-tab" onclick="switchTermTab('check')">📝 文案校对</button>
    </div>

    <!-- 搜索面板 -->
    <div class="term-panel active" id="panel-search">
      <div class="search-bar">
        <input type="text" id="termSearchInput" class="term-search-input" placeholder="输入中文、日语、英语等任意语言关键词..." autofocus>
        <button class="btn btn-primary" onclick="doTermSearch()">搜索</button>
      </div>
      <div class="search-hint">支持中文、日语、英语、韩语、繁中、越南语、印尼语、泰语 · 回车搜索</div>
      <div id="searchCount" class="search-count"></div>
      <div id="searchResults" class="search-results"></div>
    </div>

    <!-- 校对面板 -->
    <div class="term-panel" id="panel-check">
      <p class="search-hint" style="margin-bottom:8px;">粘贴日文文案，自动识别其中的游戏术语并显示对照表</p>
      <textarea id="checkInput" class="check-textarea" placeholder="粘贴日文文案，例如：&#10;ツリネバの新イベントが始まりました！露米を使って攻略しましょう..."></textarea>
      <button class="btn btn-primary" onclick="doTermCheck()" style="margin-top:10px;">开始校对</button>
      <div id="checkResult" class="check-result"></div>
    </div>
  </div>

  <script src="/static/js/terminology.js"></script>
</body>
</html>
